<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a12" />
  <title>GameVault | Sua biblioteca de jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Menu lateral">
      <a class="brand" href="#/" aria-label="GameVault, início"><span class="brand-mark" aria-hidden="true">GV</span><span class="brand-name">GameVault</span></a>
      <nav class="side-nav" id="sideNav" aria-label="Navegação principal"></nav>
      <div class="side-account" id="sideAccount"></div>
    </aside>
    <header class="topbar">
      <a class="brand brand-compact" href="#/" aria-label="GameVault, início"><span class="brand-mark" aria-hidden="true">GV</span></a>
      <form class="search" id="searchForm" role="search">
        <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" name="q" placeholder="Buscar jogo, categoria ou plataforma" aria-label="Buscar jogo, categoria ou plataforma" autocomplete="off" />
      </form>
      <button class="account-btn" id="accountBtn" type="button">Entrar</button>
    </header>
    <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navegação principal (celular)"></nav>
  </div>
  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <button class="icon-btn sheet-close" type="button" data-close-sheet aria-label="Fechar">×</button>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>
  <dialog class="sheet sheet-confirm" id="confirm" aria-labelledby="confirmTitle">
    <form method="dialog" class="confirm-body">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="actions"><button class="btn btn-ghost" value="cancel">Voltar</button><button class="btn btn-primary" id="confirmOk" value="ok">Confirmar</button></div>
    </form>
  </dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
